[package]
name = "capstone"
version = "0.2.0"
edition = "2021"
# aifc and the rubato/audioadapter family declare 1.87; pinning it here turns a
# too-old toolchain into one clear cargo message instead of a wall of type
# errors inside someone else's crate.
rust-version = "1.87"
description = "Batch loudness, clip repair, warmth and pitch correction for finished audio files"
license = "MIT"
publish = false

[lib]
name = "capstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Optimisation is on in the dev profile, which is unusual and deliberate.
#
# Capstone is an offline batch audio processor, so every build that runs is a
# build that has to chew through real signal. Unoptimised, the DSP runs about
# forty times slower: the integration suite in `tests/` takes over ten minutes
# against twenty-four seconds optimised, and `tauri dev` is slow enough that
# processing a folder of tracks is not worth waiting for. Debug info is kept, so
# a panic still names the line.
#
# `profile.dev` rather than only `profile.test` because an integration test
# links the library as a dependency, and a dependency is built with the dev
# profile however the test target itself is built. `profile.test` covers the
# unit tests, which are compiled into the library target itself.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[features]
default = ["mp3"]
# rusty_mp3 is the only permissively licensed MP3 encoder and it is very new, so
# MP3 output sits behind a flag: it can be dropped or swapped without touching
# any call site in audio::encode.
mp3 = ["dep:rusty_mp3"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
walkdir = "2"

# Decoding. The defaults carry opt-simd, all-meta, wav, flac, pcm, adpcm, ogg,
# vorbis and mkv, so they are NOT switched off: re-listing them by hand is how a
# format silently goes missing. The extra features are the ones symphonia keeps
# opt-in because they are not royalty-free, plus the two containers we need --
# isomp4 or .m4a will not open at all, caf for Apple's own container.
symphonia = { version = "0.6.1", features = [
    "aac",
    "alac",
    "isomp4",
    "mp3",
    "aiff",
    "caf",
] }

# Encoding: one crate per output format.
hound = "3.5.1"
aifc = "0.7.0"
alac-encoder = "0.3.0"
rusty_mp3 = { version = "1.0.5", optional = true }
# Dropping the default `par` feature removes flacenc's own internal thread pool,
# so it cannot fight the rayon pool for the max_cores budget. Capstone
# parallelises across files, never inside one encode.
flacenc = { version = "0.5.1", default-features = false, features = ["log"] }

# Analysis and DSP.
ebur128 = "0.1.11"
rubato = "5.0.1"
signalsmith-stretch = "0.1.3"
rustfft = "6.4.1"

rayon = "1.12.0"

# Cover art. lofty reads the embedded picture out of ID3v2, MP4 ilst and Vorbis
# comments through one API, which covers every container Capstone decodes, so
# there is no per-format branch to keep in step with the decoder list.
lofty = "0.25.5"

# Only the codecs embedded art is actually stored in, plus PNG for writing the
# thumbnail back out. The default feature set pulls in a dozen more decoders
# that nothing here can reach, and each one is compile time and attack surface
# for a byte string that came out of someone else's tagger.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

base64 = "0.22.1"

